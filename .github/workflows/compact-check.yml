name: Compact Cloud Function

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'index.js'
      - 'scripts/compact-core.js'
      - 'scripts/build-compact.js'
      - 'scripts/check-compact.js'
      - 'package.json'
      - '.github/workflows/compact-check.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: compact-file-writes-${{ github.ref }}
  cancel-in-progress: false

jobs:
  function-compact:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout latest repository state
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install formatter dependencies
        run: npm install --package-lock=false --no-audit --no-fund

      - name: Generate and verify Cloud Function
        run: npm run function:verify

      - name: Ensure index.js was not modified
        shell: bash
        run: |
          set -euo pipefail

          if [ -n "$(git status --porcelain -- index.js)" ]; then
            echo "Ошибка: исходный index.js изменён"
            git diff -- index.js || true
            exit 1
          fi

      - name: Commit index.compact.js
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'CI: update Cloud Function compact file'
          branch: ${{ github.ref_name }}
          file_pattern: 'index.compact.js'
          commit_user_name: github-actions[bot]
          commit_user_email: 41898282+github-actions[bot]@users.noreply.github.com

      - name: Upload Cloud Function artifact
        uses: actions/upload-artifact@v4
        with:
          name: cloud-function-index-compact
          path: index.compact.js
          if-no-files-found: error
          retention-days: 14
