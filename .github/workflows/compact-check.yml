name: Generate compact function

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - 'index.compact.js'
      - '.meta/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: compact-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compact:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Terser
        run: npm install --package-lock=false --no-audit --no-fund

      - name: Generate index.compact.js
        run: node scripts/build-compact.js

      - name: Commit index.compact.js
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'CI: update index.compact.js'
          branch: ${{ github.ref_name }}
          file_pattern: 'index.compact.js'
          commit_user_name: github-actions[bot]
          commit_user_email: 41898282+github-actions[bot]@users.noreply.github.com

      - name: Upload index.compact.js
        uses: actions/upload-artifact@v4
        with:
          name: index-compact
          path: index.compact.js
          if-no-files-found: error
          retention-days: 14
