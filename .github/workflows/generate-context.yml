name: Regenerate repository context

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: signaling-context-${{ github.ref }}
  cancel-in-progress: true

jobs:
  context:
    name: Generate full compact-test context
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate generator syntax
        run: node --check generate-context.js

      - name: Generate context
        run: node generate-context.js

      - name: Validate context
        shell: bash
        run: |
          set -euo pipefail

          context=".meta/project-signaling-compact-full.txt"

          test -s "$context"

          if grep -Fq "// FILE: /index.js" "$context"; then
            echo "index.js попал в контекст"
            exit 1
          fi

          if grep -Fq "// FILE: /index.compact.js" "$context"; then
            echo "index.compact.js попал в контекст"
            exit 1
          fi

          if [ -e ".meta/project-friends-adaptive.txt" ]; then
            echo "Удалите старый project-friends-adaptive.txt"
            exit 1
          fi

          ls -lh "$context"

      - name: Commit context
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'CI: regenerate signaling compact context'
          branch: ${{ github.ref_name }}
          file_pattern: '.meta/project-signaling-compact-full.txt'
          commit_user_name: github-actions[bot]
          commit_user_email: 41898282+github-actions[bot]@users.noreply.github.com

      - name: Upload context
        uses: actions/upload-artifact@v4
        with:
          name: vi3-signaling-repository-context
          path: .meta/project-signaling-compact-full.txt
          if-no-files-found: error
          retention-days: 14
